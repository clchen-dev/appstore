services:
  loki:
    image: grafana/loki:3.7.3
    container_name: ${CONTAINER_NAME}
    restart: always
    networks:
      - 1panel-network
    ports:
      - "${PANEL_APP_PORT_HTTP}:3100"
    command:
      - "-config.file=/etc/loki/loki-config.yml"
    volumes:
      - ./conf/loki-config.yml:/etc/loki/loki-config.yml:ro
      - ./loki:/loki
      - ./rules:/loki/rules
    labels:
      createdBy: "Apps"
networks:
  1panel-network:
    external: true
